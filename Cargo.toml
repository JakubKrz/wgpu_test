[profile.release]
strip = true

[package]
name = "wgpu_test"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"
tobj = { version = "4.0.5", default-features = false, features = ["async"] }
glam = { version = "0.33.7", features = ["bytemuck"] }
egui = "0.36.2"
egui-winit = "0.36.2"
egui-wgpu = "0.36.2"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "hdr"]
